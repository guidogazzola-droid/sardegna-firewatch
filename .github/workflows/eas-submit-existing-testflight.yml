name: Submit existing iOS build to TestFlight

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-submit-existing-testflight.yml"

permissions:
  contents: read

concurrency:
  group: eas-submit-existing-testflight
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_ID: "36b5a27c-6833-4351-b231-5d67276c3572"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci --no-audit --no-fund

      - name: Wait for EAS build 8
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            eas build:view "$EAS_BUILD_ID" --json > eas-build.json
            status="$(node -e "const f=require('fs'); const b=JSON.parse(f.readFileSync('eas-build.json','utf8')); process.stdout.write(String(b.status || 'UNKNOWN'))")"
            echo "EAS build status: $status (attempt $attempt/60)"
            case "$status" in
              FINISHED)
                rm -f eas-build.json
                exit 0
                ;;
              ERRORED|CANCELED)
                echo "::error::EAS build ended with status $status."
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::Timed out waiting for the EAS build."
          exit 1

      - name: Submit build 8 to TestFlight
        run: eas submit --platform ios --id "$EAS_BUILD_ID" --profile production --non-interactive --wait

name: Submit existing iOS build to TestFlight

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-submit-existing-testflight.yml"

permissions:
  contents: read

concurrency:
  group: eas-submit-existing-testflight
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_ID: "36b5a27c-6833-4351-b231-5d67276c3572"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci --no-audit --no-fund

      - name: Resolve and wait for EAS build 8
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            eas build:list --platform ios --limit 10 --json --non-interactive > eas-builds.json
            summary="$(node - <<'NODE'
          const fs = require("fs");
          const builds = JSON.parse(fs.readFileSync("eas-builds.json", "utf8"));
          for (const build of builds) {
            console.error(
              `EAS build ${build.id}: buildNumber=${build.appBuildVersion ?? "?"} status=${build.status}`,
            );
          }
          const target =
            builds.find((build) => build.id === process.env.EAS_BUILD_ID) ??
            builds.find((build) => String(build.appBuildVersion) === "8");
          if (!target) {
            console.error("Build number 8 was not found.");
            process.exit(4);
          }
          process.stdout.write(`${target.id}\t${target.status}`);
          NODE
          )"
            IFS=$'\t' read -r resolved_id status <<< "$summary"
            echo "Resolved EAS build: $resolved_id; status: $status (attempt $attempt/60)"
            case "$status" in
              FINISHED)
                echo "RESOLVED_EAS_BUILD_ID=$resolved_id" >> "$GITHUB_ENV"
                rm -f eas-builds.json
                exit 0
                ;;
              ERRORED|CANCELED)
                echo "::error::EAS build ended with status $status."
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::Timed out waiting for the EAS build."
          exit 1

      - name: Submit build 8 to TestFlight
        run: eas submit --platform ios --id "$RESOLVED_EAS_BUILD_ID" --profile production --non-interactive --wait

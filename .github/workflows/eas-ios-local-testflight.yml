name: Build iOS locally and submit to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eas-ios-local-testflight.yml

permissions:
  contents: read

concurrency:
  group: eas-ios-local-testflight
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Local macOS production build and TestFlight submit
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: "1"
      CI: "1"

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Require Expo token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The repository secret EXPO_TOKEN is missing."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify project, Apple link, and remote build number
        run: |
          eas whoami
          eas project:info
          eas integrations:asc:status --json
          eas build:version:get --platform ios --profile local-production --non-interactive

      - name: Build signed iOS archive locally
        shell: bash
        run: |
          eas build --platform ios --profile local-production --local --non-interactive --freeze-credentials --output "$RUNNER_TEMP/SabettaPiro.ipa"

      - name: Submit archive to TestFlight
        shell: bash
        run: |
          eas submit --platform ios --profile production --path "$RUNNER_TEMP/SabettaPiro.ipa" --non-interactive --wait

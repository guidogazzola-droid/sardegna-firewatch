name: Connect EAS to App Store Connect app

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/eas-asc-connect.yml"

permissions:
  contents: read

concurrency:
  group: eas-asc-connect
  cancel-in-progress: true

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci --no-audit --no-fund

      - name: Install synchronized prompt support
        run: python3 -m pip install --disable-pip-version-check pexpect

      - name: Connect the exact bundle identifier
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          import pexpect

          env = os.environ.copy()
          env.pop("CI", None)
          child = pexpect.spawn(
              "eas",
              [
                  "integrations:asc:connect",
                  "--bundle-id",
                  "com.guidogazzola.sardiniafirewatch",
              ],
              env=env,
              encoding="utf-8",
              timeout=180,
          )
          child.logfile = sys.stdout
          child.expect_exact("Select an App Store Connect API key:")
          child.sendline("")
          child.expect_exact("Select an App Store Connect app:")
          child.sendline("")
          child.expect(pexpect.EOF)
          child.close()
          if child.exitstatus:
              raise SystemExit(child.exitstatus)
          PY

      - name: Verify App Store Connect link
        run: eas integrations:asc:status --json

name: Build and submit iOS to TestFlight

# SabettaPiro 1.1.0 build 18 TestFlight trigger, 2026-07-29

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eas-ios-testflight.yml

permissions:
  contents: read

concurrency:
  group: eas-ios-testflight
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: EAS production build and TestFlight submit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Require Expo token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The repository secret EXPO_TOKEN is missing."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify project and app configuration
        run: |
          eas whoami
          eas project:info
          npx expo config --type public

      - name: Verify App Store Connect link
        run: eas integrations:asc:status --json

      - name: Build iOS and submit to TestFlight
        run: eas build --platform ios --profile production --non-interactive --auto-submit --wait
